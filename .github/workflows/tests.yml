name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q -m 'not network and not slow'
        env:
          MPLBACKEND: Agg
      - run: pytest -q tests/test_scripts.py -k 'synthetic or acceptance'
        env:
          MPLBACKEND: Agg
      - run: python -m pip wheel . --no-deps --wheel-dir dist
