name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      LMM_TORCH_INTRAOP_THREADS: '1'
      LMM_TORCH_INTEROP_THREADS: '1'
    steps:
      # Exact revisions observed in the repository's inspected successful setup steps.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Configure Matplotlib cache
        shell: bash
        run: printf 'MPLCONFIGDIR=%s/lmm-matplotlib\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      # CPU wheels avoid multi-GB optional CUDA dependencies. Installation on this
      # target must be verified by the owner; no workflow was dispatched here.
      - run: python -m pip install -c release/paper-environment.txt torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -c release/paper-environment.txt -e '.[dev]'
      - run: python scripts/release_validate.py --run-checks
      - run: python -m pip wheel . --no-deps --wheel-dir dist
