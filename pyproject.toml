[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lmm"
version = "0.1.0"
description = "Learning Optimal Liquidation with Closing Auctions — research code"
requires-python = ">=3.10"
dependencies = [
    "certifi>=2025.1.31",
    "numpy>=2.0",
    "pandas>=2.3",
    "matplotlib>=3.9",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "torch>=2.11",
    "gymnasium>=1.2,<1.3",
    "stable-baselines3==2.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lmm-train = "lmm.experiments.train:main"
lmm-evaluate = "lmm.experiments.evaluate:main"
lmm-make-figures = "lmm.experiments.make_figures:main"
lmm-make-tables = "lmm.experiments.make_tables:main"
lmm-make-report = "lmm.experiments.make_report:main"
lmm-policy-differences = "lmm.experiments.policy_differences:main"
lmm-load-midquotes = "lmm.data.load_midquote_data:main"
lmm-diagnose-simulator = "lmm.experiments.diagnose_simulator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: slow integration tests (deselect with -m 'not slow')",
    "legacy: characterization tests of the legacy main.py/data.py emulators (pre-refactor golden values)",
    "network: tests that hit an external data API (deselect with -m 'not network')",
]
