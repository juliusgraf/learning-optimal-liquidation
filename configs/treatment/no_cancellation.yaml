# Matched no-cancellation sensitivity for every learned algorithm.
#
# DQN receives the genuine 127-action auction head. DDPG/TD3/SAC receive a
# two-dimensional auction proposal (K, offset). The environment rejects c=1,
# so benchmarks and direct action submissions cannot bypass the treatment.
experiment:
  ablation_label: H_on__shaping_off__auction_on__cancel_off
actions:
  auction_cancel_mode: never
  auction_order_mode: multi
