# Synthetic setting: rough-Heston mid price on the realized CLOB decision clock.
# The numerical grid is 120 minutes of CLOB trading followed by a 30-minute
# closing auction, matching the historical experiment chronology.

experiment:
  name: synthetic_rough_heston
  setting: synthetic_rough_heston

midprice:
  model: rough_heston
  rough_heston:           # annualized Richard et al. scheme on a minute clock
    H: 0.1                # Hurst H
    rho_h: -0.7           # price-vol correlation (distinct from rho_lob)
    v0: 0.02              # V_0
    theta: 0.02           # revised variance-drift level
    varsigma: 0.3         # mean reversion
    nu: 0.3               # vol-of-vol
    s_star: 98280.0       # 252 * 6.5 * 60 trading minutes/year
    rough_heston_max_step_minutes: null  # retained legacy generator; refinement is opt-in

# Frozen from independent training paths, not policy/test PnL.
# Original fit protocol is retained in the development Git history.
algo1:
  clob_forecast_weights: [0.0, 0.19015297415681834, 0.2345652342449872, 0.4142559859516085]
