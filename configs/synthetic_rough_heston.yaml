# Synthetic setting: rough-Heston mid price (legacy main.py experiment).
# Overlay on base.yaml; values from main.py:1417-1422 + module constants
# (audit/PARAMS_FROM_CODE.md, rulings D6, D14).

experiment:
  name: synthetic_rough_heston
  setting: synthetic_rough_heston
  episodes: 2000          # main.py:1438

clob_flow:
  lambda0: 1.0            # main.py:1419 — event-driven hat-grid genuinely skips
                          # decision times at this intensity (AUDIT A.1)

midprice:
  model: rough_heston
  rough_heston:           # Richard et al. scheme, kept exactly (ruling D14);
                          # params main.py:1421-1422 (match Abi Jaber-El Euch)
    H: 0.1                # Hurst H
    rho: -0.7             # price-vol correlation
    v0: 0.02              # V_0
    theta: 0.04           # long-run variance
    kappa: 0.3            # mean reversion (paper's lambda)
    xi: 0.3               # vol-of-vol (paper's nu)
    seconds_per_year: 5896800.0  # 252 * 6.5 * 3600; main.py:25-33 (1 grid unit = 1 s)

benchmark:
  as_sigma_rule: pooled_paths   # std of log-returns pooled over training paths;
                                # main.py:1942-1954
