# TD3 hyperparameters (Phase 5; continuous-action relaxation, ruling D9).
# Standard literature defaults (Fujimoto et al. 2018); finalized with
# docs/continuous_action_extension.md.

algo:
  name: td3
  hyperparams:
    buffer_size: 50000
    min_buffer: 5000
    batch_size: 128
    actor_lr: 3.0e-4
    critic_lr: 3.0e-4
    hidden_layers: [64, 64]
    target_soft_tau: 0.005
    exploration_noise_std: 0.1
    target_noise_std: 0.2       # target policy smoothing
    target_noise_clip: 0.5
    policy_delay: 2             # delayed actor updates
    grad_clip_norm: 1.0
    updates_per_env_step: 1
