# One-step Double DQN on the exact action grid. MSE retains the contribution
# of rare inventory losses; phase junctions use the auction target network.
# The 5/95-episode exploration schedule is fixed, not stretched with run length.
# Full production budget remains 800 episodes; bounded verification uses 180.

algo:
  name: dqn
  hyperparams:
    buffer_size: 50000
    min_buffer: 5000
    min_buffer_clob: 2500
    min_buffer_auction: 960
    batch_size: 128
    lr: 0.00015
    loss: mse
    grad_clip_norm: 1.0
    hidden_layers:
    - 256
    - 256
    action_embedding_dim: 32
    safe_auction_initialization: false
    target_update_interval: 1000
    target_soft_tau: 0.005
    double_q: true
    updates_per_env_step: 1
    update_every: 1
    reward_scale: 1.0
    activation: relu
    device: cpu
    checkpoint_interval_episodes: 100
    epsilon_start: 1.0
    epsilon_end: 0.05
    epsilon_decay_episodes: 90.0
    epsilon_warmup_episodes: 5
    epsilon_auction_scale: 1.0
    safe_auction_noop_margin: 0.02
    auction_learning_start_episode: 0
rl:
  n_step: 1
