# Stable-Baselines3 2.7.1; standard updates with a shared optimizer gradient-norm bound.
algo:
  name: sac
  backend: sb3
  hyperparams:
    buffer_size: 50000
    min_buffer_clob: 512
    min_buffer_auction: 512
    batch_size: 128
    hidden_layers:
    - 256
    - 256
    learning_rate: 0.0003
    target_soft_tau: 0.005
    reward_scale: 1.0
    device: cpu
    checkpoint_interval_episodes: 100
    ent_coef: auto_0.001
    target_entropy: auto
    grad_clip_norm: 1.0
