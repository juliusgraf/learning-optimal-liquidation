# Stable-Baselines3 2.7.1; standard updates with a shared optimizer gradient-norm bound.
# Invertible conditioning for the deterministic actor/critic; same raw information.
rl:
  phase_normalization: true
  auction_inventory_asinh: true
algo:
  name: ddpg
  backend: sb3
  hyperparams:
    buffer_size: 50000
    min_buffer_clob: 512
    min_buffer_auction: 512
    batch_size: 128
    hidden_layers:
    - 256
    - 256
    learning_rate: 0.0003
    actor_learning_rate: 0.0001
    target_soft_tau: 0.0025
    reward_scale: 1.0
    device: cpu
    checkpoint_interval_episodes: 100
    exploration_noise_std: 0.1
    grad_clip_norm: 1.0
    # Bound critic feature extrapolation; keep native single-critic DDPG.
    critic_layer_norm: true
