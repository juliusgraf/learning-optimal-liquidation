# base.yaml — all model/RL constants shared by both settings.
#
# SOURCE OF TRUTH (rulings D6-D7): the values passed at the LEGACY CODE'S
# INSTANTIATION SITES — synthetic: main.py:1417-1422 (now legacy/main.py),
# historical: data.py:1386-1398 (now legacy/data.py) — extracted in
# audit/PARAMS_FROM_CODE.md. Constructor defaults and the paper table
# tab:params_generative are NOT authoritative, except where a later author
# ruling explicitly changes a calibration (currently D21 for p1/p2).
#
# Setting-specific values (experiment name/episodes, mid-price model,
# lambda0, AS sigma rule) live in synthetic_rough_heston.yaml /
# historical_sp500.yaml; algorithm hyperparameters in algo/*.yaml.

experiment:
  name: ""           # set by the setting overlay
  setting: ""        # set by the setting overlay
  episodes: 0        # E; set by the setting overlay (2000 synth / 1000 hist)
  master_seed: 42    # legacy MASTER seed (main.py:1410); scheme rebuilt per D10
  seeds: [42]        # explicit seed list; multi-seed launchers override this list
  ablation_label: H_on__shaping_on__auction_on
  auction_enabled: true
  results_root: results/revision_v2
  artifact_schema_version: 2

grid:
  tau_op: 120        # tau_op (auction open); main.py:1417 / data.py:1387
  tau_cl: 150        # tau_cl (clearing time); main.py:1417 / data.py:1387
  h: 30              # fixed auction horizon in action intervals
  T_physical: 150.0  # physical session length; dt = T/tau_cl = 1.0
  alpha: 0.01        # tick size alpha; main.py:1422 / data.py:1394
  S0: 100.0          # initial mid S^mid_0; main.py:263 (CSV pre-normalized, D13)
  I0: 100            # initial inventory I_0; ctor arg `I`; main.py:1417
  I_max: 100         # legacy normalization constant (== I0); clipping removed (D8)

clob_flow:
  lambda0: 1.0       # Poisson intensity lambda_0 per side; main.py:1419 (synthetic
                     # value; historical_sp500.yaml overrides to 60.0, data.py:1392)
  v_m: 2.0           # Pareto scale v_m; main.py:1418
  gamma_m: 2.5       # Pareto shape gamma_m; main.py:1419
  V: 30              # exogenous market-order cap (strategic V_max is below)
  V_inf: 15.0        # top-of-book scale V_inf (Beta multiplier); `V_top_max`; main.py:1421
  beta_a: 2.0        # Beta shape a; main.py:1422
  beta_b: 5.0        # Beta shape b; main.py:1422
  rho_lob: 0.5       # geometric CLOB depth decay
  L_max: 12          # maximum CLOB book depth

auction_flow:
  p1: 1.0            # new exogenous MM arrival prob. LEGACY/D6 value: 0.3
                     # (main.py:592). AUTHOR-RESOLVED OVERRIDE (D21, 2026-08-28):
                     # with p2=0 this guarantees >=1 exogenous MM in every clearing
                     # solve, including the end-of-auction-open solve. It bounds the
                     # denominator sum K_i + sum K^a away from zero and prevents the
                     # continuous-action small-positive-slope exploit. TRADE-OFF: this
                     # is a denser-liquidity regime than the legacy calibration; see
                     # audit/AUDIT.md F.2.
  p2: 0.0            # exogenous MM cancellation prob. LEGACY/D6 value: 0.2
                     # (main.py:597). D21: arrived MMs persist; see p1.
  p3: 0.3            # new taker arrival prob per side (independent); main.py:601,609
  p4: 0.05           # taker cancellation prob per side. RULING D7: the legacy
                     # Bernoulli(0.1) x fair-coin construction (main.py:616-625)
                     # has EFFECTIVE rate 0.05; implemented as one Bernoulli(0.05).
  D_mu: 0.1          # numerical floor on active exogenous auction slope
  U1: 0.1            # exogenous schedule slope lower bound
  U2: 2.0            # exogenous schedule slope upper bound
  M1: -10            # exogenous schedule price-offset lower bound (ticks)
  M2: 10             # exogenous schedule price-offset upper bound (ticks)

midprice:
  model: ""          # "rough_heston" | "historical"; set by the setting overlay

algo1:
  H0: 100.0          # explicit projected-clearing initialization
  eta_H: 0.95        # explicit smoothing coefficient

reward:
  k_star: 1000       # k* in f_c; f_c(u)=min(1,u_+/(k*alpha))
  lambda_inv: 0.5    # terminal inventory penalty lambda; `lambda_param`; main.py:1417
  q: 1.0             # wrong-side penalty q in f_a; main.py:1418
  d: 0.1             # cancellation cost unit d (cost d_t*c_t, d_t = (t-n-1)d, D4);
                     # main.py:1418
  shaping_enabled: true
  clawback_shaping: false
  numerical_guard: false  # D8: optional far-out float guard, default OFF
  # numerical_guard_bound: 1.0e9  # |I_tau_cl| threshold when the guard is on
  #                               # (dataclass default; far outside the
  #                               # economic range, loud log if it binds)

rl:
  chi: 1.0           # revised problem is undiscounted for every method
  discount_mode: undiscounted  # every nonterminal Bellman coefficient is one
  checkpoint_metric: risk_adjusted_pnl   # Pi_lambda; shaped return trains but
                                         # never selects the reported policy
  normalizer_fit_episodes: 32  # dedicated training-only random-policy paths;
                               # frozen before learning and saved in checkpoints
  validation_size: 24
  validation_frequency_episodes: 100
  validation_patience_evals: 5
  test_size: 100
  h_cl_feature_enabled: true

actions:
  # CLOB: one wait plus v=1..30, delta=0..12 => 391 actions.
  V_max: 30
  L_max: 12
  # Auction: K=(10/3)k, k=0..10; b=-25..25; canonical K=0 actions.
  # Enabled cancellation: 2 + 2*10*51 = 1022; disabled: 1 + 10*51 = 511.
  beta: 3.3333333333333335
  K_max: 10
  B_max: 25
  auction_cancel_mode: enabled  # headline full model; use the no-cancellation
                                # treatment overlay for the matched sensitivity

features:
  # Exact common manuscript order; phase-inactive coordinates are zero.
  clob: &common_features
    [time, inventory, h_cl, s_mid, decision_index,
     depth_ask, depth_bid, top_ask, top_bid,
     n_mm, n_buy, n_sell, cancel_admissible,
     own_slope, own_weighted_quote, exogenous_slope,
     auction_imbalance, exogenous_weighted_quote]
  auction: *common_features

benchmark:
  z: 10.0                  # auction heuristic slope multiplier z; main.py:1048
  dust_threshold: 0.01     # q < 1e-2 => no auction order; main.py:1043
  as_n_samples: 5000       # revised manuscript baseline
  as_gamma: 0.0            # AS risk aversion gamma -> 0; main.py:1940
  as_sigma_rule: ""        # "pooled_paths" | "single_path"; set by the setting overlay
  as_sigma_n_paths: 100    # simulated mid paths pooled for sigma (pooled_paths rule)
  twap_delta_mode: min     # TWAP quotes at delta = min of the grid = 1
