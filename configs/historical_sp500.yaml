# Historical setting: S&P 500 fixed mid path (legacy data.py experiment).
# Overlay on base.yaml; values from data.py:1386-1398, 1651-1679
# (audit/PARAMS_FROM_CODE.md, rulings D6, D13, D15).
#
# NOTE (ruling D15): algo1.tau stays 0.95 here — the legacy historical run's
# smoothing of 0.99 was an accidental reuse of the RL discount (data.py:1391)
# and is intentionally NOT reproduced; regenerated results differ on this axis.

experiment:
  name: historical_sp500
  setting: historical_sp500
  episodes: 1000          # data.py:1677

clob_flow:
  lambda0: 60.0           # data.py:1392 — 1-minute bars => ~1 arrival/s/side;
                          # the decision grid is always the integer grid (AUDIT A.1)

midprice:
  model: historical
  historical:
    csv_path: legacy/data.csv   # frozen experimental input (ruling D13): S&P 500
                                # 1-min mids, Dec 31 2025, 2:30-5:00 pm EST,
                                # pre-normalized to 100 at session start
    symbols: [MSFT, JPM, PG, GOOGL, CAT]   # data.py:1651
    normalize_first: 100.0      # loader rule --normalize first=100 (D13)
    n_rows: 120                 # rows 0..119 consumed (= tau_op); data.py:1654
    date: "2025-12-31"          # session date provenance (Phase 6); the loader
                                # (lmm.data.load_yfinance_data) regenerates this CSV
    path_policy: fixed          # same realized path every episode (legacy/paper)

benchmark:
  as_sigma_rule: single_path    # std of log-returns of the single fixed path;
                                # data.py:1557-1559
