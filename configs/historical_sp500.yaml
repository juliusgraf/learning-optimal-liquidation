# Historical-midprice setting.  The frozen local dataset contains 20 complete
# one-minute sessions for the manuscript's five S&P 500 assets, partitioned
# chronologically into 10 training, 5 validation, and 5 test sessions.  The
# sidecar digest and split contract are verified whenever an environment or run
# is created.

experiment:
  name: historical_sp500
  setting: historical_sp500
  episodes: 500           # 2026-06-15: denser flow (lambda0=60 => ~149 decisions
                          # /ep, ~2x synthetic) + fixed mid path => fewer episodes
                          # suffice; all four beat AS/TWAP by 500 ep on MSFT.
                          # (legacy data.py:1677 used 1000.)

clob_flow:
  lambda0: 60.0           # data.py:1392 — 1-minute bars => ~1 arrival/s/side;
                          # the decision grid is always the integer grid (AUDIT A.1)

midprice:
  model: historical
  historical:
    csv_path: data/historical_sp500_1m.csv
    symbols: [MSFT, JPM, PG, GOOGL, CAT]
    normalize_first: 100.0
    n_rows: 121                 # observations at minutes 0..tau_op inclusive
    date: "2026-08-03..2026-08-28"
    path_policy: split_pool
    timezone: America/New_York
    missing_data_treatment: ffill  # source gaps were forward-filled per session
                                   # and are enumerated in the sidecar
    split_id: sp500_1m_2026-08_v1
    train_date_range: ["2026-08-03", "2026-08-14"]
    validation_date_range: ["2026-08-17", "2026-08-21"]
    test_date_range: ["2026-08-24", "2026-08-28"]

benchmark:
  as_sigma_rule: pooled_paths   # fitted only from the training-session pool
