# LEGACY DATA-PROXY SETTING. It retains normalized Yahoo close bars only for
# data-pipeline regression checks. Market mechanics inherit the same shared
# simulator as every other setting. Publication runs use true SIP midquotes in
# historical_sp500_midquotes.yaml.

experiment:
  name: historical_sp500
  setting: historical_sp500

midprice:
  model: historical
  historical:
    csv_path: data/historical_sp500_1m.csv
    symbols: [MSFT, JPM, PG, GOOGL, CAT]
    normalize_first: 100.0
    n_rows: 121                 # observations at minutes 0..tau_op inclusive
    date: "2026-08-03..2026-08-28"
    path_policy: split_pool
    timezone: America/New_York
    missing_data_treatment: ffill  # source gaps were forward-filled per session
                                   # and are enumerated in the sidecar
    split_id: sp500_1m_2026-08_v1
    train_date_range: ["2026-08-03", "2026-08-14"]
    validation_date_range: ["2026-08-17", "2026-08-21"]
    test_date_range: ["2026-08-24", "2026-08-28"]
    source: yfinance
    artifact_normalization: first=100
